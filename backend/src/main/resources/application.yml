spring:
  application:
    name: focusquest-backend

  datasource:
    url: jdbc:h2:file:./data/focusquest;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

server:
  port: 8080
  address: 127.0.0.1

focusquest:
  jwt:
    # Placeholder only. Replace with a random, at-least-32-byte secret via an
    # environment variable (FOCUSQUEST_JWT_SECRET) — never commit a real secret.
    secret: "${FOCUSQUEST_JWT_SECRET:CHANGE_ME_local_dev_placeholder_secret_not_for_prod_use}"
    expiration-minutes: 60
  # The XP and gem economy; see docs/technical_architecture.md, section 19 (XP and gem economy).
  xp:
    # XP for completing a session, per planned focus minute. Only completed sessions earn it.
    per-focus-minute: 1
    # XP the first time a streak period reaches its target.
    daily-streak-bonus: 10
    weekly-streak-bonus: 50
    # Deducted once for overriding blocking on an abandoned session. Equal to 10 focused minutes.
    manual-override-penalty: 10
  gems:
    # Gems granted for each level reached (from level 2).
    per-level: 5
    # Gems the first time a streak period reaches its target.
    daily-streak: 1
    weekly-streak: 5
  cors:
    allowed-origins:
      - http://localhost:5173
      # Replace with the extension's actual id from chrome://extensions after loading it unpacked.
      - chrome-extension://REPLACE_WITH_EXTENSION_ID

logging:
  level:
    root: INFO
    com.example.focusquest: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
